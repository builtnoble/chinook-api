name: chinook

services:
  app:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    env_file:
      - .env
    environment:
      - APP_PORT=${APP_PORT:-3000}
      # Inside the compose network the database is the `db` service on 5432, not DB_HOST from .env
      # (which is for commands run on the host, such as drizzle-kit).
      - DB_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-chinook}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: builtnoble/chinook-postgres:1
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_DB=${DB_NAME:-chinook}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - chinook-data:/var/lib/postgresql/data

  # The API reference and guides, generated from the API's /openapi.json and docs/. The image is built and published
  # by CI (see docs-site/README.md), so `docker compose up` does not need the private theme it is built with.
  docs:
    image: builtnoble/chinook-docs:${DOCS_TAG:-edge}
    ports:
      - "${DOCS_PORT:-3001}:8080"

  # Serves http://api.chinook.localhost and http://docs.chinook.localhost on PROXY_PORT (80 by default).
  proxy:
    image: caddy:2.10-alpine
    ports:
      - "${PROXY_PORT:-80}:80"
    environment:
      - APP_PORT=${APP_PORT:-3000}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_started
      docs:
        condition: service_healthy

volumes:
  chinook-data:
