server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The container's port is not the one clients use (a mapped port, or the proxy), so redirects stay relative.
    absolute_redirect off;

    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The site is a static export without trailing slashes: /albums is albums.html, and /albums/ goes there too.
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    # Pages are revalidated on every load, so a new image shows up straight away. add_header in a location
    # replaces the ones above it, so the security headers are repeated.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Next fingerprints everything under _next/static, so it can be cached for good.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
