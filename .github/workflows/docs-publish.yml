name: Publish docs image

# Builds the docs site with the private theme and publishes it as builtnoble/chinook-docs, which docker compose pulls.
#   main            -> edge
#   a v1.2.3 tag    -> 1.2.3, 1.2, 1 (and latest)
# It never runs for pull requests, so forks cannot reach the theme or the registry credentials.
#
# Setup, once: the private theme repository, a read-only deploy key on it, and these repository secrets:
#   THEME_DEPLOY_KEY      the private half of that deploy key
#   DOCKERHUB_USERNAME    a Docker Hub user that can push to builtnoble/chinook-docs
#   DOCKERHUB_TOKEN       an access token for that user
on:
  push:
    branches: [main]
    paths:
      - api/**
      - docs/**
      - docs-site/**
      - .dockerignore
      - .github/workflows/docs-publish.yml
    tags: ['v*']
  # Run it by hand after changing the theme, which does not trigger a build by itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publish
  cancel-in-progress: false

env:
  IMAGE: builtnoble/chinook-docs
  THEME_REPOSITORY: builtnoble/chinook-docs-theme
  # A tag or commit of the theme. Pin it for reproducible builds; main builds whatever the theme has now.
  THEME_REF: main

jobs:
  publish:
    name: Build and push
    if: github.repository == 'builtnoble/chinook-api'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The theme is licensed and must not be public, so it is only ever a build input here: it is not pushed, not
      # logged and not cached. Only the compiled static site ends up in the image.
      - name: Check out the private theme
        uses: actions/checkout@v4
        with:
          repository: ${{ env.THEME_REPOSITORY }}
          ref: ${{ env.THEME_REF }}
          ssh-key: ${{ secrets.THEME_DEPLOY_KEY }}
          path: .theme
          persist-credentials: false

      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # The defaults come from the GitHub repository, so its name and license would describe the image wrongly.
          # The site's design is the Tailwind Plus Protocol template, which is not under the repository's license.
          labels: |
            org.opencontainers.image.title=Chinook API docs
            org.opencontainers.image.description=The Chinook API documentation site: a static site generated from the API's OpenAPI document and guides, served by nginx on port 8080.
            org.opencontainers.image.source=https://github.com/builtnoble/chinook-api
            org.opencontainers.image.documentation=https://github.com/builtnoble/chinook-api/blob/main/docs-site/README.md
            org.opencontainers.image.licenses=NOASSERTION
            io.github.builtnoble.chinook-docs.design-license=The site's design is derived from the Tailwind Plus Protocol template and is used under the Tailwind Plus license (https://tailwindcss.com/plus/license). The image holds only the compiled static site.

      # No cache-from or cache-to: a cache would hold layers made from the theme's source. The stages that build the
      # site run on the runner's own architecture, so building for both platforms needs no emulation.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs-site/Dockerfile
          build-contexts: theme=.theme
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Check that the image holds only the built site
        env:
          REFERENCE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --platform linux/amd64 --entrypoint sh "$REFERENCE" -c '
            test -f /usr/share/nginx/html/index.html || { echo "no index.html"; exit 1; }
            source_files="$(find / -xdev \( -name "*.tsx" -o -name "*.mdx" -o -name package.json -o -name LICENSE.md \) \
              -not -path "/proc/*" 2>/dev/null)"
            if [ -n "$source_files" ]; then echo "theme source found in the image:"; echo "$source_files"; exit 1; fi
            echo "ok: static files only"
          '
